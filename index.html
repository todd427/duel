<!DOCTYPE html>
<html lang="en" data-theme="folio">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duel — Two Minds, One Problem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ── Themes ────────────────────────────────────────────────── */

[data-theme="parchment"] {
  --bg:           #f5f0e8;
  --surface:      #faf7f2;
  --surface2:     #ede9e0;
  --border:       rgba(0,0,0,0.1);
  --text:         #2c2416;
  --text-dim:     rgba(44,36,22,0.84);
  --text-faint:   rgba(44,36,22,0.81);
  --left-accent:  #1a7a6e;
  --left-ink:     #12544c;
  --left-bg:      rgba(26,122,110,0.07);
  --left-border:  rgba(26,122,110,0.3);
  --right-accent: #8a6a1f;
  --right-ink:    #5e4815;
  --right-bg:     rgba(138,106,31,0.07);
  --right-border: rgba(138,106,31,0.3);
  --error:        #7d3333;
  --warn:         #614628;
  --send-bg:      #2c2416;
  --send-fg:      #f5f0e8;
  --tag-bg:       rgba(0,0,0,0.05);
  --code-bg:      rgba(0,0,0,0.06);
  --shadow:       0 4px 24px rgba(0,0,0,0.12);
}

[data-theme="folio"] {
  --bg:           #111009;
  --surface:      #181610;
  --surface2:     #1f1c14;
  --border:       rgba(255,255,255,0.07);
  --text:         #e2d9c4;
  --text-dim:     rgba(226,217,196,0.79);
  --text-faint:   rgba(226,217,196,0.74);
  --left-accent:  #4ec9b0;
  --left-ink:     #4ec9b0;
  --left-bg:      rgba(78,201,176,0.07);
  --left-border:  rgba(78,201,176,0.22);
  --right-accent: #c8a655;
  --right-ink:    #c8a655;
  --right-bg:     rgba(200,166,85,0.07);
  --right-border: rgba(200,166,85,0.25);
  --error:        #ea9090;
  --warn:         #e0a05c;
  --send-bg:      #e2d9c4;
  --send-fg:      #111009;
  --tag-bg:       rgba(255,255,255,0.05);
  --code-bg:      rgba(0,0,0,0.35);
  --shadow:       0 4px 24px rgba(0,0,0,0.6);
}

[data-theme="obsidian"] {
  --bg:           #0d0d0f;
  --surface:      #141417;
  --surface2:     #1a1a1f;
  --border:       rgba(255,255,255,0.07);
  --text:         #e8eaf0;
  --text-dim:     rgba(232,234,240,0.72);
  --text-faint:   rgba(232,234,240,0.68);
  --left-accent:  #4ec9b0;
  --left-ink:     #4ec9b0;
  --left-bg:      rgba(78,201,176,0.07);
  --left-border:  rgba(78,201,176,0.25);
  --right-accent: #c792ea;
  --right-ink:    #c792ea;
  --right-bg:     rgba(199,146,234,0.07);
  --right-border: rgba(199,146,234,0.25);
  --error:        #e98e8e;
  --warn:         #e0a05c;
  --send-bg:      #e8eaf0;
  --send-fg:      #0d0d0f;
  --tag-bg:       rgba(255,255,255,0.05);
  --code-bg:      rgba(0,0,0,0.4);
  --shadow:       0 4px 24px rgba(0,0,0,0.7);
}

[data-theme="modern"] {
  --bg:           #f8f9fa;
  --surface:      #ffffff;
  --surface2:     #f0f2f5;
  --border:       rgba(0,0,0,0.08);
  --text:         #1a1d23;
  --text-dim:     rgba(26,29,35,0.79);
  --text-faint:   rgba(26,29,35,0.76);
  --left-accent:  #0066ff;
  --left-ink:     #0048b5;
  --left-bg:      rgba(0,102,255,0.06);
  --left-border:  rgba(0,102,255,0.2);
  --right-accent: #e6450a;
  --right-ink:    #932c06;
  --right-bg:     rgba(230,69,10,0.06);
  --right-border: rgba(230,69,10,0.2);
  --error:        #853737;
  --warn:         #684a2b;
  --send-bg:      #1a1d23;
  --send-fg:      #ffffff;
  --tag-bg:       rgba(0,0,0,0.04);
  --code-bg:      rgba(0,0,0,0.05);
  --shadow:       0 2px 12px rgba(0,0,0,0.08);
}

/* ── Reset ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

/* ── Header ────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.wordmark {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  flex-shrink: 0;
}
.wordmark em {
  font-style: italic;
  font-weight: 400;
  color: var(--text-dim);
  font-size: 13px;
  margin-left: 8px;
  font-family: 'IBM Plex Sans', sans-serif;
}

.header-spacer { flex: 1; }

.api-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  text-transform: uppercase;
}

input#apiKey {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  padding: 6px 10px;
  width: 220px;
  outline: none;
  transition: border-color 0.15s;
}
input#apiKey:focus { border-color: var(--left-accent); }
input#apiKey::placeholder { color: var(--text-faint); }

/* ── Theme switcher ────────────────────────────────────────── */
.theme-btns { display: flex; gap: 4px; }

.theme-btn {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
}
.theme-btn:hover { transform: scale(1.15); }
.theme-btn.active { border-color: var(--text); }
.theme-btn[data-t="parchment"] { background: #f5f0e8; }
.theme-btn[data-t="folio"]     { background: #111009; }
.theme-btn[data-t="obsidian"]  { background: #0d0d0f; }
.theme-btn[data-t="modern"]    { background: #f8f9fa; border: 1px solid #ccc; }

/* ── Toolbar ───────────────────────────────────────────────── */
.toolbar { display: flex; align-items: center; gap: 12px; }

.icon-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 12px;
  padding: 4px 10px;
  font-family: 'IBM Plex Mono', monospace;
  transition: border-color 0.15s, color 0.15s;
}
.icon-btn:hover { border-color: var(--text-dim); color: var(--text); }

select.preset-sel {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 12px;
  padding: 4px 10px;
  font-family: 'IBM Plex Mono', monospace;
}
select.preset-sel:hover { border-color: var(--text-dim); color: var(--text); }

.maxtok {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
}
.maxtok input {
  width: 64px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text-dim);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  padding: 3px 6px;
  outline: none;
}
.maxtok input:focus { border-color: var(--left-accent); color: var(--text); }

.web-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 10px;
  user-select: none;
}
.web-toggle input { accent-color: var(--left-accent); cursor: pointer; margin: 0; }
.web-toggle:has(input:checked) { color: var(--text); border-color: var(--left-accent); }

.ctx-wrap { position: relative; }
.ctx-panel {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 50;
  width: 300px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ctx-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.ctx-row { display: flex; align-items: center; gap: 8px; }
.ctx-row input[type="checkbox"] { accent-color: var(--left-accent); cursor: pointer; margin: 0; }
.ctx-name {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text);
  width: 56px;
  flex-shrink: 0;
}
.ctx-row input[type="password"] {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  padding: 4px 8px;
  outline: none;
}
.ctx-row input[type="password"]:focus { border-color: var(--left-accent); }
.ctx-note {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 11px;
  line-height: 1.5;
  color: var(--text-dim);
}

.tool-trace { display: flex; flex-direction: column; gap: 4px; }
.tool-trace:not(:empty) { margin-bottom: 6px; }
.tool-chip {
  align-self: flex-start;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 2px 8px;
  max-width: 88%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.trunc-note {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--warn);
  margin-top: 6px;
}

/* ── Panes ─────────────────────────────────────────────────── */
.panes {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 1px;
  background: var(--border);
}

.pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* ── Pane header ───────────────────────────────────────────── */
.pane-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.pane-sigil {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 700;
  flex-shrink: 0;
}
.pane-left  .pane-sigil { color: var(--left-ink); }
.pane-right .pane-sigil { color: var(--right-ink); }

.pane-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  flex-shrink: 0;
}

select.model-sel {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text-dim);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  padding: 3px 6px;
  outline: none;
  cursor: pointer;
}

textarea.sys-prompt {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text-dim);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 11px;
  padding: 4px 8px;
  resize: none;
  outline: none;
  min-height: 28px;
  max-height: 28px;
  line-height: 1.5;
}
textarea.sys-prompt::placeholder { color: var(--text-faint); }
textarea.sys-prompt:focus { color: var(--text); }

.btn-clear {
  background: none;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text-faint);
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  padding: 3px 8px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.btn-clear:hover { border-color: var(--error); color: var(--error); }

/* ── Messages ──────────────────────────────────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.messages::-webkit-scrollbar       { width: 3px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Message bubbles ───────────────────────────────────────── */
.msg {
  display: flex;
  flex-direction: column;
  gap: 4px;
  animation: fadeUp 0.2s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-role {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding-left: 2px;
}

.msg.user { align-items: flex-end; }

.msg-body {
  max-width: 88%;
  padding: 10px 13px;
  border-radius: 8px;
  line-height: 1.65;
  font-size: 13.5px;
}

.msg.user .msg-body {
  background: var(--tag-bg);
  border: 1px solid var(--border);
  align-self: flex-end;
}

.pane-left  .msg.assistant .msg-body {
  background: var(--left-bg);
  border: 1px solid var(--left-border);
  align-self: flex-start;
}

.pane-right .msg.assistant .msg-body {
  background: var(--right-bg);
  border: 1px solid var(--right-border);
  align-self: flex-start;
}

/* ── Attachment thumbnail in message ───────────────────────── */
.msg-attachment {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 8px;
  margin-bottom: 6px;
  align-self: flex-end;
  max-width: 88%;
}
.msg-attachment span { opacity: 1; }

/* ── Cross-send ────────────────────────────────────────────── */
.cross-send {
  align-self: flex-start;
  background: none;
  border: 1px dashed var(--border);
  border-radius: 4px;
  color: var(--text-faint);
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.08em;
  padding: 2px 8px;
  margin-top: 2px;
  transition: all 0.15s;
}
.pane-left  .cross-send:hover { border-color: var(--right-accent); color: var(--right-ink); }
.pane-right .cross-send:hover { border-color: var(--left-accent);  color: var(--left-ink); }

/* ── Thinking ──────────────────────────────────────────────── */
.thinking { display: flex; align-items: center; gap: 6px; padding: 8px 0; animation: fadeUp 0.2s ease; }
.thinking-dots { display: flex; gap: 4px; }
.thinking-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  animation: pulse 1.2s ease-in-out infinite;
}
.pane-left  .thinking-dot { background: var(--left-accent); }
.pane-right .thinking-dot { background: var(--right-accent); }
.thinking-dot:nth-child(2) { animation-delay: 0.2s; }
.thinking-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes pulse {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
  40%            { opacity: 1;   transform: scale(1.1); }
}

/* ── Code blocks ───────────────────────────────────────────── */
.msg-body pre {
  background: var(--code-bg);
  border-radius: 5px;
  padding: 10px 12px;
  overflow-x: auto;
  margin: 8px 0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  line-height: 1.6;
}
.msg-body code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  background: var(--code-bg);
  padding: 1px 5px;
  border-radius: 3px;
}
.msg-body pre code { background: none; padding: 0; }
.msg-body p { margin-bottom: 8px; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body h1, .msg-body h2, .msg-body h3 {
  font-family: 'Playfair Display', serif;
  margin: 10px 0 6px;
  line-height: 1.3;
}
.msg-body h1 { font-size: 17px; }
.msg-body h2 { font-size: 15px; }
.msg-body h3 { font-size: 14px; font-style: italic; }
.msg-body ul, .msg-body ol { padding-left: 18px; margin: 6px 0; }
.msg-body li { margin: 3px 0; }
.msg-body strong { font-weight: 600; }
.msg-body em { font-style: italic; }
.msg-body hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

/* ── Error ─────────────────────────────────────────────────── */
.error-bubble {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--error);
  background: rgba(224,92,92,0.07);
  border: 1px solid rgba(224,92,92,0.2);
  border-radius: 6px;
  padding: 8px 12px;
  animation: fadeUp 0.2s ease;
}

/* ── Input area ────────────────────────────────────────────── */
.input-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  flex-shrink: 0;
}

.route-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.route-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-faint);
}
.route-btns { display: flex; gap: 4px; }

.route-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text-dim);
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.05em;
  padding: 4px 12px;
  transition: all 0.15s;
}
.route-btn:hover { color: var(--text); }
.route-btn.active-left  { background: var(--left-bg);  border-color: var(--left-border);  color: var(--left-ink); }
.route-btn.active-both  { background: var(--tag-bg);   border-color: var(--text-dim);     color: var(--text); }
.route-btn.active-right { background: var(--right-bg); border-color: var(--right-border); color: var(--right-ink); }

.status {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  margin-left: auto;
}

/* ── Attachment strip ──────────────────────────────────────── */
#attach-strip {
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
#attach-strip.has-files { display: flex; }

.attach-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  padding: 3px 8px;
  animation: fadeUp 0.15s ease;
}
.attach-pill .pill-name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach-pill .pill-type { opacity: 1; }
.attach-pill .pill-rm {
  background: none;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  padding: 0 0 0 2px;
  transition: color 0.15s;
}
.attach-pill .pill-rm:hover { color: var(--error); }

/* ── Compose row ───────────────────────────────────────────── */
.compose-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.attach-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 16px;
  padding: 0 12px;
  height: 52px;
  transition: border-color 0.15s, color 0.15s;
  flex-shrink: 0;
  align-self: flex-end;
  display: flex;
  align-items: center;
}
.attach-btn:hover { border-color: var(--text-dim); color: var(--text); }

textarea#prompt {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  padding: 10px 14px;
  resize: none;
  outline: none;
  min-height: 52px;
  max-height: 180px;
  transition: border-color 0.15s;
}
textarea#prompt:focus { border-color: var(--left-accent); }
textarea#prompt::placeholder { color: var(--text-faint); }

.send-btn {
  background: var(--send-bg);
  border: none;
  border-radius: 8px;
  color: var(--send-fg);
  cursor: pointer;

}
.send-btn:hover    { opacity: 0.85; }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>

<script>
// ── State ─────────────────────────────────────────────────────
const histories   = { left: [], right: [] };
let   route       = 'both';
let   busy        = false;
let   pendingFiles = [];   // [{ name, kind, mediaType, data }]
// kind: 'image' | 'document' | 'text'
// data: base64 string (image/pdf) or plain text string

// ── Theme ─────────────────────────────────────────────────────
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
  localStorage.setItem('duel_theme', t);
}

// ── Route ─────────────────────────────────────────────────────
function setRoute(r) {
  route = r;
  document.getElementById('btn-left').className  = 'route-btn' + (r === 'left'  ? ' active-left'  : '');
  document.getElementById('btn-both').className  = 'route-btn' + (r === 'both'  ? ' active-both'  : '');
  document.getElementById('btn-right').className = 'route-btn' + (r === 'right' ? ' active-right' : '');
}

// ── Clear ─────────────────────────────────────────────────────
function clearPane(side) {
  histories[side] = [];
  document.getElementById('msgs-' + side).innerHTML = '';
}

// ── File attachment ───────────────────────────────────────────
const IMAGE_TYPES = ['image/jpeg','image/png','image/gif','image/webp'];
const PDF_TYPE    = 'application/pdf';

function attachFiles(fileList) {
  Array.from(fileList).forEach(f => {
    const reader = new FileReader();
    if (IMAGE_TYPES.includes(f.type)) {
      reader.onload = e => {
        const b64 = e.target.result.split(',')[1];
        pendingFiles.push({ name: f.name, kind: 'image', mediaType: f.type, data: b64 });
        renderStrip();
      };
      reader.readAsDataURL(f);
    } else if (f.type === PDF_TYPE) {
      reader.onload = e => {
        const b64 = e.target.result.split(',')[1];
        pendingFiles.push({ name: f.name, kind: 'document', mediaType: PDF_TYPE, data: b64 });
        renderStrip();
      };
      reader.readAsDataURL(f);
    } else {
      // Text / code — read as plain text
      reader.onload = e => {
        pendingFiles.push({ name: f.name, kind: 'text', mediaType: f.type || 'text/plain', data: e.target.result });
        renderStrip();
      };
      reader.readAsText(f);
    }
  });
  // Reset so the same file can be re-attached
  document.getElementById('fileInput').value = '';
}

function removeFile(idx) {
  pendingFiles.splice(idx, 1);
  renderStrip();
}

function renderStrip() {
  const strip = document.getElementById('attach-strip');
  strip.innerHTML = '';
  strip.classList.toggle('has-files', pendingFiles.length > 0);
  pendingFiles.forEach((f, i) => {
    const pill = document.createElement('div');
    pill.className = 'attach-pill';
    const icon = f.kind === 'image' ? '🖼' : f.kind === 'document' ? '📄' : '📝';
    pill.innerHTML = `
      <span>${icon}</span>
      <span class="pill-name">${escHtml(f.name)}</span>
      <span class="pill-type">${f.kind}</span>
      <button class="pill-rm" onclick="removeFile(${i})" title="Remove">✕</button>`;
    strip.appendChild(pill);
  });
}

// ── Build API content array for a user turn ───────────────────
function buildContent(text, attachments) {
  if (!attachments || attachments.length === 0) return text;

  const parts = [];

  attachments.forEach(f => {
    if (f.kind === 'image') {
      parts.push({ type: 'image', source: { type: 'base64', media_type: f.mediaType, data: f.data } });
    } else if (f.kind === 'document') {
      parts.push({ type: 'document', source: { type: 'base64', media_type: f.mediaType, data: f.data } });
    } else {
      // Prepend text file content inline
      parts.push({ type: 'text', text: `\`\`\`\n// ${f.name}\n${f.data}\n\`\`\`` });
    }
  });

  if (text) parts.push({ type: 'text', text });
  return parts;
}

// ── Markdown renderer ─────────────────────────────────────────
function renderMd(text) {
  if (typeof text !== 'string') return '';
  const blocks = [];
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const i = blocks.length;
    blocks.push(`<pre><code>${escHtml(code.trim())}</code></pre>`);
    return `\x00BLOCK${i}\x00`;
  });
  text = text
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`)
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^---+$/gm, '<hr>')
    .replace(/^\s*[-*]\s+(.+)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  text = text.split(/\n\n+/).map(p => {
    p = p.trim();
    if (!p || p.startsWith('<h') || p.startsWith('<ul') || p.startsWith('<hr') || p.startsWith('\x00')) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');
  blocks.forEach((b, i) => { text = text.replace(`\x00BLOCK${i}\x00`, b); });
  return text;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Append message ────────────────────────────────────────────
function appendMsg(side, role, content, attachments) {
  const container = document.getElementById('msgs-' + side);
  const wrapper   = document.createElement('div');
  wrapper.className = `msg ${role}`;

  const roleEl = document.createElement('div');
  roleEl.className = 'msg-role';
  roleEl.textContent = role === 'user' ? 'you' : side === 'left' ? 'α' : 'β';

  wrapper.appendChild(roleEl);

  // Show attachment pills in the message bubble (user messages only)
  if (role === 'user' && attachments && attachments.length > 0) {
    attachments.forEach(f => {
      const pill = document.createElement('div');
      pill.className = 'msg-attachment';
      const icon = f.kind === 'image' ? '🖼' : f.kind === 'document' ? '📄' : '📝';
      pill.innerHTML = `<span>${icon}</span> <span>${escHtml(f.name)}</span> <span>${f.kind}</span>`;
      wrapper.appendChild(pill);
    });
  }

  const body = document.createElement('div');
  body.className = 'msg-body';
  body.innerHTML = renderMd(typeof content === 'string' ? content : '[multipart message]');
  wrapper.appendChild(body);

  if (role === 'assistant') {
    const xBtn = document.createElement('button');
    xBtn.className = 'cross-send';
    const target = side === 'left' ? 'right' : 'left';
    const sigil  = side === 'left' ? 'β' : 'α';
    xBtn.textContent = `→ send to ${sigil}`;
    xBtn.onclick = () => crossSend(content, target);
    wrapper.appendChild(xBtn);
  }

  container.appendChild(wrapper);
  container.scrollTop = container.scrollHeight;
}

// ── Thinking indicator ────────────────────────────────────────
function showThinking(side) {
  const container = document.getElementById('msgs-' + side);
  const el = document.createElement('div');
  el.className = 'thinking';
  el.id = 'thinking-' + side;
  el.innerHTML = `<div class="thinking-dots">
    <div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div>
  </div>`;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function hideThinking(side) {
  const el = document.getElementById('thinking-' + side);
  if (el) el.remove();
}

// ── Error ─────────────────────────────────────────────────────
function showError(side, msg) {
  const container = document.getElementById('msgs-' + side);
  const el = document.createElement('div');
  el.className = 'error-bubble';
  el.textContent = '⚠ ' + msg;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// ── Max output tokens ─────────────────────────────────────────
function maxTokens() {
  const v = parseInt(document.getElementById('maxTokens').value, 10);
  if (!Number.isFinite(v) || v < 256) return 4096;
  return Math.min(v, 64000);  // 64K is valid for every model in the picker
}

// ── Live assistant bubble (streaming target) ──────────────────
function startAssistantMsg(side) {
  const container = document.getElementById('msgs-' + side);
  const wrapper   = document.createElement('div');
  wrapper.className = 'msg assistant';
  const roleEl = document.createElement('div');
  roleEl.className = 'msg-role';
  roleEl.textContent = side === 'left' ? 'α' : 'β';
  wrapper.appendChild(roleEl);
  const tools = document.createElement('div');   // web-tool activity chips
  tools.className = 'tool-trace';
  wrapper.appendChild(tools);
  const body = document.createElement('div');
  body.className = 'msg-body';
  wrapper.appendChild(body);
  container.appendChild(wrapper);
  return { container, wrapper, tools, body };
}

function addToolChip(h, label) {
  const chip = document.createElement('div');
  chip.className = 'tool-chip';
  chip.textContent = label;
  h.tools.appendChild(chip);
  h.container.scrollTop = h.container.scrollHeight;
}

function finalizeAssistant(side, h, fullText, stopReason) {
  h.body.innerHTML = renderMd(fullText);
  if (stopReason === 'max_tokens') {
    const note = document.createElement('div');
    note.className = 'trunc-note';
    note.textContent = '⚠ truncated — hit max tokens; raise “max tok” and ask it to continue';
    h.wrapper.appendChild(note);
  }
  const xBtn = document.createElement('button');
  xBtn.className = 'cross-send';
  const target = side === 'left' ? 'right' : 'left';
  const sigil  = side === 'left' ? 'β' : 'α';
  xBtn.textContent = `→ send to ${sigil}`;
  xBtn.onclick = () => crossSend(fullText, target);
  h.wrapper.appendChild(xBtn);
  h.container.scrollTop = h.container.scrollHeight;
}

// ── Web access (server-side tools) ────────────────────────────
// Anthropic-hosted web_search + web_fetch run on Anthropic's infra (no backend
// here). web_fetch can only read URLs already in context, so pairing it with
// web_search lets "look at example.com/x" resolve via search → fetch.
function webTools() {
  if (!document.getElementById('webToggle')?.checked) return null;
  return [
    { type: 'web_search_20250305', name: 'web_search', max_uses: 5 },
    { type: 'web_fetch_20250910',  name: 'web_fetch',  max_uses: 5,
      citations: { enabled: true }, max_content_tokens: 50000 },
  ];
}

// ── Read-only MCP context (FoxxeLabs servers) ─────────────────
// Server-side MCP connector: Anthropic calls these servers (no backend here).
// Both use OAuth 2.1 — paste a bearer token per server (sessionStorage).
// Read-only is enforced by allow-listing only non-mutating tools.
const MCP_SERVERS = {
  mnemos: { url: 'https://mnemos.foxxelabs.ie/mcp', label: 'Mnemos',
            readonly: ['query_memory','get_belief_context','get_stats','get_doc_count','list_filters'] },
  rialu:  { url: 'https://rialu.ie/mcp', label: 'Rialú',
            readonly: ['list_projects','get_project'] },
};

function mcpConfig() {
  const servers = [], tools = [];
  for (const [id, cfg] of Object.entries(MCP_SERVERS)) {
    if (localStorage.getItem('duel_mcp_' + id + '_on') !== '1') continue;
    const token = sessionStorage.getItem('duel_mcp_' + id) || '';
    if (!token) continue;
    servers.push({ type: 'url', url: cfg.url, name: id, authorization_token: token });
    const configs = {};
    cfg.readonly.forEach(t => { configs[t] = { enabled: true }; });   // allow-list
    tools.push({ type: 'mcp_toolset', mcp_server_name: id,
                 default_config: { enabled: false }, configs });
  }
  return servers.length ? { servers, tools } : null;
}

// ── Claude API call (streaming SSE, with server tools) ────────
// hooks: { onText(fullText), onTool(label) }
async function streamClaude(side, userText, attachments, hooks) {
  const apiKey = document.getElementById('apiKey').value.trim();
  const useProxy = !apiKey;   // no key → hosted /api/chat proxy (secrets server-side)
  const model  = document.getElementById('model-' + side).value;
  const sys    = document.getElementById('sys-' + side).value.trim();
  const tools  = webTools();
  const mcp    = mcpConfig();

  const content = buildContent(userText, attachments);
  histories[side].push({ role: 'user', content });

  let answer = '', stopReason = null, guard = 0;

  // Loop only to resume across pause_turn (server-tool iteration cap)
  while (true) {
    // Hosted: the Cloudflare Pages Function injects the key + MCP tokens
    // server-side. BYOK/local (a key is present): call Anthropic directly.
    let res;
    if (useProxy) {
      res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model, system: sys || undefined, messages: histories[side],
          max_tokens: maxTokens(),
          web:    !!document.getElementById('webToggle')?.checked,
          mnemos: !!document.getElementById('mcp-mnemos-on')?.checked,
          rialu:  !!document.getElementById('mcp-rialu-on')?.checked,
        })
      });
    } else {
      const body = { model, max_tokens: maxTokens(), messages: histories[side], stream: true };
      if (sys) body.system = sys;
      const allTools = [ ...(tools || []), ...(mcp?.tools || []) ];
      if (allTools.length) body.tools = allTools;
      if (mcp) body.mcp_servers = mcp.servers;
      const headers = {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      };
      if (mcp) headers['anthropic-beta'] = 'mcp-client-2025-11-20';
      res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST', headers, body: JSON.stringify(body)
      });
    }

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    const blocks = [];        // reconstructed assistant content blocks
    const partial = {};       // index -> partial tool-input JSON
    stopReason = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;                // SSE frames separated by a blank line
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const frame = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        for (const line of frame.split('\n')) {
          const t = line.trimStart();
          if (!t.startsWith('data:')) continue;
          const payload = t.slice(5).trim();
          if (!payload) continue;
          let evt;
          try { evt = JSON.parse(payload); } catch { continue; }

          if (evt.type === 'content_block_start') {
            blocks[evt.index] = structuredClone(evt.content_block);
          } else if (evt.type === 'content_block_delta') {
            const b = blocks[evt.index];
            if (evt.delta?.type === 'text_delta') {
              if (b) b.text = (b.text || '') + evt.delta.text;
              answer += evt.delta.text;
              hooks.onText(answer);
            } else if (evt.delta?.type === 'input_json_delta') {
              partial[evt.index] = (partial[evt.index] || '') + evt.delta.partial_json;
            }
          } else if (evt.type === 'content_block_stop') {
            const b = blocks[evt.index];
            if (b && (b.type === 'server_tool_use' || b.type === 'mcp_tool_use')) {
              try { b.input = JSON.parse(partial[evt.index] || '{}'); } catch {}
              if (b.type === 'mcp_tool_use') hooks.onTool(`🧠 ${b.server_name || 'mcp'}: ${b.name}`);
              else if (b.name === 'web_search') hooks.onTool(`🔍 searched: ${b.input?.query ?? ''}`);
              else if (b.name === 'web_fetch') hooks.onTool(`🌐 fetched: ${b.input?.url ?? ''}`);
              else hooks.onTool(`🛠 ${b.name}`);
            }
          } else if (evt.type === 'message_delta' && evt.delta?.stop_reason) {
            stopReason = evt.delta.stop_reason;
          } else if (evt.type === 'error') {
            throw new Error(evt.error?.message || 'stream error');
          }
        }
      }
    }

    // Preserve the full turn (text + tool blocks) so server-tool context
    // survives, and so a pause_turn can be resumed by re-sending.
    histories[side].push({ role: 'assistant', content: blocks.filter(Boolean) });

    if (stopReason === 'pause_turn' && guard++ < 5) continue;
    return { text: answer, stopReason };
  }
}

// ── Run one streamed turn into a pane ─────────────────────────
async function runStream(side, userText, attachments) {
  let h = null;
  const ensure = () => { if (!h) { hideThinking(side); h = startAssistantMsg(side); } return h; };
  try {
    const { text, stopReason } = await streamClaude(side, userText, attachments, {
      onText: acc => { ensure(); h.body.innerHTML = renderMd(acc); h.container.scrollTop = h.container.scrollHeight; },
      onTool: label => { ensure(); addToolChip(h, label); },
    });
    ensure();
    finalizeAssistant(side, h, text, stopReason);
  } catch (err) {
    hideThinking(side);
    if (h) h.wrapper.remove();
    showError(side, err.message);
  }
}

// ── Send ──────────────────────────────────────────────────────
async function send() {
  if (busy) return;

  const promptEl  = document.getElementById('prompt');
  const prompt    = promptEl.value.trim();
  const attachments = [...pendingFiles];

  if (!prompt && attachments.length === 0) return;

  const apiKey = document.getElementById('apiKey').value.trim();

  const sides = route === 'both' ? ['left','right'] : [route];

  busy = true;
  document.getElementById('sendBtn').disabled = true;
  promptEl.value = '';
  promptEl.style.height = 'auto';

  // Clear pending files
  pendingFiles = [];
  renderStrip();

  setStatus('Thinking…');

  sides.forEach(s => appendMsg(s, 'user', prompt, attachments));
  sides.forEach(s => showThinking(s));

  await Promise.all(sides.map(s => runStream(s, prompt, attachments)));
  setStatus('Ready');

  busy = false;
  document.getElementById('sendBtn').disabled = false;
  promptEl.focus();
}

// ── Cross-send ────────────────────────────────────────────────
async function crossSend(content, targetSide) {
  if (busy) return;

  const apiKey = document.getElementById('apiKey').value.trim();

  busy = true;
  document.getElementById('sendBtn').disabled = true;
  setStatus('Cross-sending…');

  appendMsg(targetSide, 'user', content);
  showThinking(targetSide);

  await runStream(targetSide, content);
  setStatus('Ready');

  busy = false;
  document.getElementById('sendBtn').disabled = false;
}

// ── Export Markdown ───────────────────────────────────────────
function exportMd() {
  const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
  let md = `# Duel Session\n_Exported: ${now}_\n\n`;

  const maxLen = Math.max(histories.left.length, histories.right.length);
  if (maxLen === 0) { alert('Nothing to export.'); return; }

  md += `## α Alpha\n\n`;
  histories.left.forEach(m => {
    const text = Array.isArray(m.content)
      ? m.content.filter(p => p.type === 'text').map(p => p.text).join('\n')
      : m.content;
    md += `**${m.role === 'user' ? 'You' : 'α'}:** ${text}\n\n`;
  });

  md += `---\n\n## β Beta\n\n`;
  histories.right.forEach(m => {
    const text = Array.isArray(m.content)
      ? m.content.filter(p => p.type === 'text').map(p => p.text).join('\n')
      : m.content;
    md += `**${m.role === 'user' ? 'You' : 'β'}:** ${text}\n\n`;
  });

  const blob = new Blob([md], { type: 'text/markdown' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `duel-${now.replace(/[: ]/g,'-')}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Presets ───────────────────────────────────────────────────
const PRESETS = {
  archreview: {
    left:  'You are a sceptical software architect. Challenge every assumption. Find the failure mode, the edge case, the thing that breaks at scale. Be concise and specific.',
    right: 'You are a pragmatic builder. Find the simplest design that ships and works. Be concise and specific.'
  },
  redblue: {
    left:  'You are a red-team security reviewer. Find how this can be attacked, abused, or broken. Think like an adversary.',
    right: 'You are a blue-team defender. Propose mitigations, hardening, and detection for the risks raised. Be practical.'
  },
  writing: {
    left:  'You are a demanding line editor. Cut fluff, flag weak arguments, tighten prose. Quote the lines you would change.',
    right: 'You are a generous developmental editor. Say what works, how to amplify it, and sketch the next draft.'
  }
};
function applyPreset(name) {
  if (name === 'clear') {
    document.getElementById('sys-left').value  = '';
    document.getElementById('sys-right').value = '';
  } else if (PRESETS[name]) {
    document.getElementById('sys-left').value  = PRESETS[name].left;
    document.getElementById('sys-right').value = PRESETS[name].right;
  }
  document.getElementById('presetSel').value = '';
  saveSettings();
}

// ── Persist panel settings (system prompts, models, max tokens) ─
const PERSIST_IDS = ['sys-left','sys-right','model-left','model-right','maxTokens'];
function saveSettings() {
  const data = {};
  PERSIST_IDS.forEach(id => { data[id] = document.getElementById(id).value; });
  localStorage.setItem('duel_settings', JSON.stringify(data));
}
(function restoreSettings() {
  let data;
  try { data = JSON.parse(localStorage.getItem('duel_settings') || '{}'); } catch { data = {}; }
  PERSIST_IDS.forEach(id => {
    if (data[id] != null && data[id] !== '') document.getElementById(id).value = data[id];
  });
})();
PERSIST_IDS.forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input',  saveSettings);
  el.addEventListener('change', saveSettings);
});

const savedTheme = localStorage.getItem('duel_theme');
if (savedTheme) setTheme(savedTheme);
